<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengiriman</title>

<style>
body{margin:0;padding:10px;font-family:Arial;background:#f5f7fa}

.header{
  background:#1565c0;
  color:white;
  padding:12px;
  text-align:center;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
}

.card{
  background:white;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  white-space:pre-wrap;
}

.aksi{
  display:flex;
  gap:5px;
  margin-top:8px;
}

a,button{
  flex:1;
  padding:6px;
  border:none;
  border-radius:6px;
  font-size:12px;
  text-align:center;
}

.wa{
  background:#25D366;
  color:white;
  text-decoration:none;
}

.kirim{
  background:#1565c0;
  color:white;
}
</style>
</head>

<body>

<div class="header">
CEK PENGIRIMAN - PDF BESOK
</div>

<div id="list">Loading...</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxuDE6FlKICIcXm24k8UPP8GW7MPlPAOrqkGyyZCO11CKGj_tYbhKx7CSyrXqXFGpAA/exec";

function getVal(text,key){
  const r = new RegExp(key + ": (.*)");
  const m = text.match(r);
  return m ? m[1].trim() : "";
}

function loadData(){

fetch(API_URL)
.then(r=>r.json())
.then(data=>{

let html="";

data.forEach(row=>{

const text = row[0];
if(!text) return;

const customer = getVal(text,"CUSTOMER");
const wa1 = getVal(text,"WA1");
const wa2 = getVal(text,"WA2");

html += `
<div class="card">

${text}

<div class="aksi">

${wa1 ? `<a class="wa" href="https://wa.me/62${wa1.substring(1)}" target="_blank">WA 1</a>` : ""}

${wa2 ? `<a class="wa" href="https://wa.me/62${wa2.substring(1)}" target="_blank">WA 2</a>` : ""}

<button class="kirim" onclick="kirim('${customer}')">
TERKIRIM
</button>

</div>

</div>
`;

});

document.getElementById("list").innerHTML = html;

});

}

function kirim(customer){

const driver = "DRIVER";

fetch(API_URL,{
method:"POST",
body:new URLSearchParams({
customer: customer,
driver: driver
})
})
.then(r=>r.text())
.then(res=>{

if(res=="OK"){
  alert("TERKIRIM: " + customer);
  loadData();
}else{
  alert("NOT FOUND: " + customer);
}

});

}

loadData();

</script>

</body>
</html>
