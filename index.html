<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengiriman</title>

<style>

body{
  margin:0;
  padding:15px;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
}

.header{
  background:#1565c0;
  color:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  font-size:24px;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  white-space:pre-wrap;
}

.jumlah{
  text-align:center;
  margin-bottom:15px;
}

.tanggal-besar{
  font-size:20px;
  font-weight:bold;
  color:#1565c0;
}

.total{
  font-weight:bold;
  margin-top:5px;
}

</style>
</head>

<body>

<div class="header">
  CEK PENGIRIMAN
</div>

<div id="jumlah">Memuat data...</div>
<div id="list"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwmXMx6F6-XjjsikpofXZfWJWNsnEEliyQCoFkVCMZzfn9rfAQRaJmdu8niM63p9zEE/exec";

function loadData(){

fetch(API_URL + "?t=" + new Date().getTime())
.then(r => r.text())
.then(text => {

  let data;

  try {
    data = JSON.parse(text);
  } catch(e){
    document.getElementById("list").innerHTML = "❌ Data tidak valid";
    console.log("RAW:", text);
    return;
  }

  let html = "";
  let total = 0;
  let tanggal = "";

  data.forEach(row => {

    try {

      const isi = row[0];
      const tgl = row[1];

      if(!isi) return;

      total++;

      if(!tanggal && tgl){
        tanggal = new Date(tgl).toLocaleDateString("id-ID",{
          day:"2-digit",
          month:"long",
          year:"numeric"
        });
      }

      html += `
        <div class="card">
          ${isi}
        </div>
      `;

    } catch(err){
      console.log("ROW ERROR", err);
    }

  });

  document.getElementById("jumlah").innerHTML =
  `
    <div class="tanggal-besar">📅 ${tanggal}</div>
    <div class="total">Total Pengiriman: ${total}</div>
  `;

  document.getElementById("list").innerHTML = html;

})
.catch(err => {
  console.log(err);
  document.getElementById("list").innerHTML =
    "❌ Gagal mengambil data";
});

}

loadData();

</script>

</body>
</html>
