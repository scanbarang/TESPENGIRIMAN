<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pengiriman</title>

<style>

body{
  margin:0;
  padding:15px;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
}

.header{
  background:#1565c0;
  color:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
}

.jumlah{
  text-align:center;
  margin-bottom:20px;
}

.tanggal-besar{
  font-size:24px;
  font-weight:bold;
  color:#1565c0;
}

.total{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  white-space:pre-wrap;
  line-height:1.7;
  font-size:16px;
}

</style>
</head>

<body>
<div class="header" style="text-align:center;padding:15px;">
  <img src="logo.png"
       style="width:120px;height:120px;border-radius:50%;border:4px solid #22c55e;object-fit:cover;">
  <h2 style="margin-top:10px;">CEK PENGIRIMAN</h2>
</div>


<div style="background:white;padding:15px;border-radius:15px;margin-bottom:15px;box-shadow:0 3px 10px rgba(0,0,0,.15);">

<h3>Pilih Pengiriman</h3>

<select id="pengiriman" style="width:100%;padding:10px;font-size:16px;">
<option value="">-- Pilih Nama --</option>
<option>Poniadi</option>
<option>Eko</option>
<option>Sendi</option>
<option>Dwi</option>
<option>Friza</option>
<option>Rudi</option>
</select>

</div>

<div id="jumlah" class="jumlah">
Memuat data...
</div>

<div id="list"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwmXMx6F6-XjjsikpofXZfWJWNsnEEliyQCoFkVCMZzfn9rfAQRaJmdu8niM63p9zEE/exec";

fetch(API_URL)
.then(r => r.json())
.then(data => {

  let html = "";
  let total = 0;
  let tanggalPengiriman = "";

  data.forEach(row => {

    const isi = row[0];

    if(!isi) return;

    total++;

    if(!tanggalPengiriman && row[1]){

      const tgl = new Date(row[1]);

      tanggalPengiriman =
        tgl.toLocaleDateString("id-ID",{
          day:"2-digit",
          month:"long",
          year:"numeric"
        });

    }

    const wa1Match = isi.match(/WA 1 : ([0-9]+)/);
const wa2Match = isi.match(/WA 2 : ([0-9]+)/);
const customerMatch = isi.match(/CUSTOMER : (.*)/);

const wa1 = wa1Match ? wa1Match[1] : "";
const wa2 = wa2Match ? wa2Match[1] : "";
const customer = customerMatch ? customerMatch[1].trim() : "";
html += `
<div class="card">

${isi.trim()}

<div class="aksi">
<a href="https://wa.me/62${wa1.substring(1)}"
target="_blank"
class="wa-btn">
💬 WA 1
</a>

<a href="https://wa.me/62${wa2.substring(1)}"
target="_blank"
class="wa-btn">
💬 WA 2
</a>

<button
onclick="kirimStatus(this,'${customer}','${wa1}')"
class="kirim-btn">
✅ TERKIRIM
</button>
</div>

</div>
`;
  });

  document.getElementById("jumlah").innerHTML = `
    <div class="tanggal-besar">
    🗓️ ${tanggalPengiriman}
    </div>

    <div class="total">
      Total Pengiriman : ${total}
    </div>
  `;

  document.getElementById("list").innerHTML = html;

})
.catch(err => {

  document.getElementById("jumlah").innerHTML =
  "❌ Gagal mengambil data";

  console.log(err);

});
function kirimStatus(btn,customer,wa){

const pengiriman =
document.getElementById("pengiriman").value;

if(!pengiriman){

alert("Pilih nama pengiriman terlebih dahulu");

return;

}

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
customer:customer,
status:"TERKIRIM",
pengiriman:pengiriman,
catatan:"",
wa:wa
})
})
.then(r=>r.text())
.then(res=>{

if(res == "SUDAH_TERKIRIM"){

  btn.innerHTML = "🟢 SUDAH TERKIRIM";
  btn.disabled = true;
  btn.style.background = "#16a34a";

  alert("Order ini sudah pernah ditandai TERKIRIM");

  return;

}

btn.innerHTML = "🟢 SUDAH TERKIRIM";
btn.disabled = true;
btn.style.background = "#16a34a";

alert(
  customer +
  " berhasil ditandai TERKIRIM"
);

})
.catch(err=>{

alert("Gagal : " + err);

});

}
</script>

</body>
</html>
