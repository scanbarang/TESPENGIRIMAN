<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CEK PENGIRIMAN</title>

<style>

body{
margin:0;
padding:10px;
font-family:Arial,sans-serif;
background:#f1f5f9;
}

.header{
background:#1565c0;
color:#fff;
padding:15px;
text-align:center;
border-radius:18px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header img{
width:85px;
height:85px;
border-radius:50%;
border:4px solid #fff;
object-fit:cover;
}

#jumlah{
text-align:center;
margin:12px 0;
}

.tanggal{
font-size:24px;
font-weight:bold;
color:#1565c0;
}

.total{
font-size:18px;
font-weight:bold;
margin-top:4px;
}

.card{
background:#fff;
padding:14px;
margin-bottom:12px;
border-radius:16px;
box-shadow:0 4px 12px rgba(0,0,0,.10);
font-size:14px;
white-space:pre-wrap;
line-height:1.6;
}

.aksi{
margin-top:12px;
}

.wa-row{
display:flex;
gap:8px;
margin-bottom:8px;
}

.btn{
border:none;
border-radius:10px;
padding:12px;
font-size:13px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
text-align:center;
display:flex;
justify-content:center;
align-items:center;
gap:5px;
}

.wa1{
flex:1;
background:#25D366;
color:white;
}

.wa2{
flex:1;
background:#128C7E;
color:white;
}

.kirim{
width:100%;
background:#1565c0;
color:white;
}

.sudah{
width:100%;
background:#16a34a;
color:white;
}

</style>
</head>

<body>

<div class="header">
<img src="logo.png">
<div style="margin-top:8px;font-size:22px;font-weight:bold;">
CEK PENGIRIMAN
</div>
</div>

<div id="jumlah">Memuat data...</div>
<div id="list"></div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbyt7ESUBCLIcNfzCuOZAThCyIesFFlO0nHn4jgzDYoTit6byLEksINbdUc3J0XDa-gZ/exec";

function ambilCustomer(text){

const m=text.match(/CUSTOMER\s*:\s*([^\n]+)/i);

return m ? m[1].trim() : "";

}

function ambilWa(text){

const wa=text.match(/08\d{8,13}/g);

return wa || [];

}

function kirimStatus(customer,wa){

if(!customer){
alert("Customer tidak ditemukan");
return;
}

const driver=localStorage.getItem("driver") || "DRIVER";

fetch(
API_URL+
"?customer="+encodeURIComponent(customer)+
"&driver="+encodeURIComponent(driver)+
"&wa="+encodeURIComponent(wa)
)
.then(r=>r.text())
.then(res=>{

if(res==="OK"){

alert("✅ "+customer+" terkirim");

loadData();

}else{

alert(res);

}

})
.catch(err=>{

console.log(err);

alert("Server Error");

});

}

function loadData(){

fetch(API_URL+"?t="+Date.now())
.then(r=>r.json())
.then(data=>{

const orders=data.orders || [];
const terkirim=data.terkirim || {};

let html="";
let total=0;

orders.forEach(row=>{

const isi=row[0] || "";

if(!isi) return;

total++;

const customer=ambilCustomer(isi);
const key=customer.toLowerCase();

const wa=ambilWa(isi);

const sudah=terkirim[key]===true;

let tombolWa="";

if(wa[0]){

tombolWa+=`
<a class="btn wa1"
href="https://wa.me/62${wa[0].substring(1)}"
target="_blank">
WA 1
</a>
`;

}

if(wa[1]){

tombolWa+=`
<a class="btn wa2"
href="https://wa.me/62${wa[1].substring(1)}"
target="_blank">
WA 2
</a>
`;

}

html+=`
<div class="card">

${isi}

<div class="aksi">

<div class="wa-row">
${tombolWa}
</div>

<button
class="btn ${sudah ? 'sudah' : 'kirim'}"
${sudah ? 'disabled' : ''}
onclick="kirimStatus(\`${customer}\`,\`${wa[0] || ""}\`)">

${sudah ? '✅ TERKIRIM' : '🚚 KIRIM'}

</button>

</div>

</div>
`;

});

document.getElementById("jumlah").innerHTML=`
<div class="tanggal">📦 Pengiriman Hari Ini</div>
<div class="total">Total Pengiriman : ${total}</div>
`;

document.getElementById("list").innerHTML=html;

})
.catch(err=>{

console.log(err);

document.getElementById("jumlah").innerHTML=
"❌ Gagal mengambil data";

});

}

loadData();

setInterval(loadData,5000);

</script>

</body>
</html>
