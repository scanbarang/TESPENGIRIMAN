<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengiriman</title>

<style>
body{font-family:Arial;margin:0;padding:8px;background:#f5f7fa}

.card{background:#fff;padding:10px;margin:6px;border-radius:8px;white-space:pre-wrap}

button{
  width:100%;
  padding:6px;
  margin-top:6px;
  background:#1565c0;
  color:white;
  border:none;
  border-radius:6px;
}
</style>
</head>

<body>

<h3 style="text-align:center">PDF BESOK</h3>

<div id="list">Loading...</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxuDE6FlKICIcXm24k8UPP8GW7MPlPAOrqkGyyZCO11CKGj_tYbhKx7CSyrXqXFGpAA/exec";

function getValue(text, key){
  const match = text.match(new RegExp(key + ": (.*)"));
  return match ? match[1].trim() : "";
}

function loadData(){

fetch(API_URL)
.then(r=>r.json())
.then(data=>{

let html="";

data.forEach(row=>{

const text = row[0];
if(!text) return;

const customer = getValue(text,"CUSTOMER");
const wa1 = getValue(text,"WA1");
const wa2 = getValue(text,"WA2");

html += `
<div class="card">

${text}

<button onclick="kirim('${customer}')">TERKIRIM</button>

</div>
`;

});

document.getElementById("list").innerHTML = html;

});

}

function kirim(customer){

const driver = "DRIVER";

fetch(API_URL,{
method:"POST",
body:new URLSearchParams({
customer: customer,
driver: driver
})
})
.then(r=>r.text())
.then(res=>{
alert(res);
loadData();
});

}

loadData();

</script>

</body>
</html>
