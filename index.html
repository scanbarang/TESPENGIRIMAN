<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOGIN PENGIRIMAN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body{
margin:0;
font-family:'Inter', Arial, sans-serif;
background:#f1f5f9;
color:#111;
}

/* LOGIN */
.login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
width:280px;
text-align:center;
}

.box img{
width:80px;
height:80px;
border-radius:50%;
border:3px solid #1565c0;
object-fit:cover;
margin-bottom:8px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#1565c0;
color:#fff;
font-weight:700;
cursor:pointer;
}

/* APP */
#app{
display:none;
padding:10px;
}

/* HEADER */
.header{
background:#1565c0;
color:#fff;
padding:15px;
border-radius:14px;
text-align:center;
margin-bottom:10px;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-bottom:10px;
}

.boxstat{
background:#fff;
padding:10px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.boxstat .v{font-weight:700;font-size:16px;}
.boxstat .t{font-size:12px;color:#666;}

.t1{border:1px solid #1e88e5;}
.t2{border:1px solid #16a34a;}
.t3{border:1px solid #f59e0b;}

.c1{color:#1565c0;}
.c2{color:#16a34a;}
.c3{color:#f59e0b;}

/* CARD */
.card{
background:#fff;
padding:12px;
margin-bottom:12px;
border-radius:14px;
border:2px solid #1e88e5;
box-shadow:0 4px 10px rgba(0,0,0,.08);
font-size:12.5px;
line-height:1.4;
position:relative;
}

.card::before{
content:"";
position:absolute;
left:0;
top:0;
width:4px;
height:100%;
background:#1e88e5;
}

/* WA */
.wa-group{
display:flex;
gap:10px;
margin-top:10px;
}

.wa-box{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
width:60px;
}

.wa-icon{
width:38px;
height:38px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:16px;
font-weight:700;
}

.wa2 .wa-icon{background:#128C7E;}

.wa-text{
font-size:11px;
margin-top:4px;
color:#444;
font-weight:600;
}

/* BUTTON */
.aksi{
margin-top:8px;
}

.btn{
width:100%;
height:40px;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.kirim{background:#1565c0;color:#fff;}
.sudah{background:#16a34a;color:#fff;}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">

  <div class="box">

    <img src="logo.png">

    <h3 style="margin:0;color:#1565c0;">UFO KEBONSARI MALANG</h3>
    <p style="font-size:12px;color:#666;">Sistem Pengiriman Driver</p>

    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">

    <button onclick="login()">MASUK</button>

  </div>

</div>

<!-- APP -->
<div id="app">

<div class="header">
CEK PENGIRIMAN
</div>

<div id="stats"></div>
<div id="list"></div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzjNnwv0gSi1a7OQVhkzJ-xDgJ-WRPhlNvu9WSyR-DhXOTz_DPGCOHu53eN9cOjqLna/exec";

function login(){

const user=document.getElementById("user").value;
const pass=document.getElementById("pass").value;

fetch(API_URL+"?action=login&user="+user+"&pass="+pass)
.then(r=>r.json())
.then(res=>{

if(res.status==="OK"){

localStorage.setItem("driver",res.user);

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";

loadData();

}else{
alert("Login gagal!");
}

})
.catch(()=>{
alert("Server error");
});

}

function ambilCustomer(text){
const m=text.match(/CUSTOMER\s*:\s*([^\n]+)/i);
return m ? m[1].trim() : "";
}

function ambilWa(text){
const wa=text.match(/08\d{8,13}/g);
return wa || [];
}

function kirimStatus(customer,wa){

const driver=localStorage.getItem("driver") || "-";

fetch(API_URL+
"?customer="+encodeURIComponent(customer)+
"&driver="+encodeURIComponent(driver)+
"&wa="+encodeURIComponent(wa)
)
.then(r=>r.text())
.then(()=>{
loadData();
});
}

function loadData(){

fetch(API_URL)
.then(r=>r.json())
.then(data=>{

const orders=data.orders || [];
const terkirim=data.terkirim || {};

let html="";
let total=0;
let ok=0;
let no=0;

orders.forEach(row=>{

const isi=row[0] || "";
if(!isi) return;

total++;

const customer=ambilCustomer(isi);
const key=customer.toLowerCase();
const wa=ambilWa(isi);
const sudah=terkirim[key]===true;

if(sudah) ok++; else no++;

html+=`
<div class="card">

<div>${isi}</div>

<div class="wa-group">

${wa[0] ? `
<a class="wa-box wa1" href="https://wa.me/62${wa[0].substring(1)}" target="_blank">
<div class="wa-icon">WA</div>
<div class="wa-text">WA 1</div>
</a>` : ""}

${wa[1] ? `
<a class="wa-box wa2" href="https://wa.me/62${wa[1].substring(1)}" target="_blank">
<div class="wa-icon">WA</div>
<div class="wa-text">WA 2</div>
</a>` : ""}

</div>

<div class="aksi">
<button class="btn ${sudah?'sudah':'kirim'}"
onclick="kirimStatus(\`${customer}\`,\`${wa[0]||''}\`)">
${sudah?'✓ TERKIRIM':'🚚 KIRIM'}
</button>
</div>

</div>
`;
});

document.getElementById("stats").innerHTML=`
<div class="stats">

<div class="boxstat t1">
<div class="t">TOTAL</div>
<div class="v c1">${total}</div>
</div>

<div class="boxstat t2">
<div class="t">TERKIRIM</div>
<div class="v c2">${ok}</div>
</div>

<div class="boxstat t3">
<div class="t">BELUM</div>
<div class="v c3">${no}</div>
</div>

</div>
`;

document.getElementById("list").innerHTML=html;

});

}

</script>

</body>
</html>
