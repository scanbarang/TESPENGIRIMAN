<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>CEK PENGIRIMAN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body{
margin:0;
font-family:'Inter', Arial, sans-serif;
background:#f4f6f9;
color:#111;
}

/* LOGIN */
.login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
width:280px;
text-align:center;
}

.box img{
width:80px;
height:80px;
border-radius:50%;
border:2px solid #ddd;
object-fit:cover;
margin-bottom:8px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
box-sizing: border-box;
}

/* SPINNER LOADING STYLE */
.btn-isi {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}

.spinner {
width: 18px;
height: 18px;
border: 2px solid rgba(255,255,255,0.3);
border-radius: 50%;
border-top-color: #fff;
animation: putar 0.6s linear infinite;
display: none;
}

@keyframes putar {
to { transform: rotate(360deg); }
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1565c0;
color:#fff;
font-weight:700;
cursor:pointer;
font-size: 14px;
}

button:disabled {
background: #a1a1a1 !important;
cursor: not-allowed;
}

/* APP */
#app{
display:none;
padding:10px;
}

/* HEADER */
.header{
background:#fff;
padding:16px;
border-radius:14px;
text-align:center;
margin-bottom:10px;
border:2px solid #d4af37;
box-shadow:0 0 12px rgba(212,175,55,0.4);
}

.header-title{
font-size:22px;
font-weight:900;
color:#6d28d9;
letter-spacing:2px;
}

/* PENCARIAN */
.search-container {
margin-bottom: 10px;
}
.search-input {
width: 100%;
padding: 12px;
border-radius: 12px;
border: 2px solid #6d28d9;
font-size: 14px;
font-weight: 600;
box-shadow: 0 2px 6px rgba(0,0,0,.05);
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-bottom:10px;
}

.boxstat{
background:#fff;
padding:10px;
border-radius:12px;
text-align:center;
border:2px solid #6d28d9;
box-shadow:0 0 10px rgba(109,40,217,0.15);
}

/* CARD */
.card{
background:#fff;
padding:12px;
margin-bottom:10px;
border-radius:14px;
border:2px solid #e5e7eb;
box-shadow:0 2px 6px rgba(0,0,0,.05);
font-size:13px;
line-height:1.5;
position:relative;
}

.data{
white-space:pre-line;
font-weight:600;
}

/* WA GROUP */
.wa-group{
display:flex;
gap:16px;
margin-top:12px;
margin-bottom:4px;
}

.wa-box{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
width:70px;
}

.wa-icon{
width:58px; 
height:58px;
border-radius:50%;
background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
display:flex;
align-items:center;
justify-content:center;
box-shadow: 0 4px 10px rgba(18, 140, 126, 0.4);
}

.wa2 .wa-icon{
background: linear-gradient(135deg, #128C7E 0%, #075E54 100%);
box-shadow: 0 4px 10px rgba(7, 94, 84, 0.4);
}

.wa-icon svg{
width:36px;
height:36px;
fill:#fff;
}

.wa-text{
font-size:11px;
margin-top:6px;
font-weight:700;
color:#555;
letter-spacing: 0.5px;
}

/* BUTTON */
.aksi{
margin-top:12px;
}

.btn{
width:100%;
height:44px;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.kirim{
background:#1565c0;
color:#fff;
}

.sudah{
background:#16a34a;
color:#fff;
}

/* STYLE MODAL / KAMERA */
.modal-overlay {
position: fixed;
top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0, 0, 0, 0.6);
display: flex; justify-content: center; align-items: center;
z-index: 9999; opacity: 0; pointer-events: none;
transition: opacity 0.2s ease;
}

.modal-overlay.aktif {
opacity: 1; pointer-events: auto;
}

.modal-content {
background: #fff; padding: 20px;
border-radius: 16px; width: 320px; text-align: center;
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
transform: scale(0.8); transition: transform 0.2s ease;
}

.modal-overlay.aktif .modal-content {
transform: scale(1);
}

.modal-title {
font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #111;
}

.modal-text {
font-size: 13px; color: #555; line-height: 1.4; margin-bottom: 12px;
}

#kamera-preview {
width: 100%;
height: 240px;
object-fit: cover;
border-radius: 10px;
background: #000;
margin-bottom: 10px;
}

.modal-buttons {
display: flex; gap: 10px; justify-content: center;
}

.btn-modal {
padding: 10px 16px; border: none; border-radius: 8px;
font-weight: 700; cursor: pointer; font-size: 13px; width: auto; flex: 1;
}

.btn-batal { background: #e2e8f0; color: #475569; }
.btn-oke { background: #1565c0; color: #fff; }
</style>
</head>

<body>

<div class="login" id="loginBox">
  <div class="box">
    <img src="logo.png" alt="Logo">
    <h3 style="margin:0;">UFO KEBONSARI MALANG</h3>
    <p style="font-size:12px;color:#777;">Sistem Pengiriman Driver</p>

    <div style="text-align:left;font-size:12px;margin-top:10px;font-weight:600;">Username</div>
    <input type="text" id="user" placeholder="">

    <div style="text-align:left;font-size:12px;margin-top:10px;font-weight:600;">Password</div>
    <input type="password" id="pass" placeholder="">

    <button type="button" id="btnLogin" onclick="login()">
      <div class="btn-isi">
        <span id="textLogin">MASUK</span>
        <div class="spinner" id="login-spinner"></div>
      </div>
    </button>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-title">CEK PENGIRIMAN</div>
  </div>

  <div id="stats"></div>

  <div class="search-container">
    <input type="text" id="cariCustomer" class="search-input" placeholder="🔍 Cari nama customer..." onkeyup="filterCustomer()">
  </div>

  <div id="list"></div>
</div>

<!-- MODAL KAMERA & KONFIRMASI -->
<div id="customModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title" id="mTitle">Bukti Foto Pengiriman</div>
    <div class="modal-text" id="mText">Posisikan kamera ke barang/lokasi tujuan</div>
    
    <div id="containerKamera">
      <video id="kamera-preview" autoplay playsinline></video>
    </div>

    <div class="modal-buttons" id="mButtons"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzH4e2dQErvrU5m_1Q-s66gxG68JaKFae2foTcOrTUHiZT42sqY0xYHV4Cv04_Dowgi/exec";

let streamKamera = null;
let fotoBase64Data = "";
let dataAktifPengiriman = null;

function bukaModalAlert(judul, pesan) {
  document.getElementById("mTitle").innerText = judul;
  document.getElementById("mText").innerText = pesan;
  document.getElementById("containerKamera").style.display = "none";
  document.getElementById("mButtons").innerHTML = '<button type="button" class="btn-modal btn-oke" onclick="tutupModal()">TUTUP</button>';
  document.getElementById("customModal").classList.add("aktif");
}

function tutupModal() {
  if (streamKamera) {
    streamKamera.getTracks().forEach(track => track.stop());
    streamKamera = null;
  }
  document.getElementById("customModal").classList.remove("aktif");
}

/* LOGIN */
function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;
  
  const btn = document.getElementById("btnLogin");
  const spinner = document.getElementById("login-spinner");
  const text = document.getElementById("textLogin");

  if(!user || !pass) {
    bukaModalAlert("Data Kurang", "Username dan Password harus diisi!");
    return;
  }

  btn.disabled = true;
  spinner.style.display = "block";
  text.innerText = "MEMPROSES...";

  fetch(API_URL + "?action=login&user=" + encodeURIComponent(user) + "&pass=" + encodeURIComponent(pass))
  .then(r => r.json())
  .then(res => {
    if(res.status === "OK"){
      localStorage.setItem("driver", res.user);
      
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) docEl.requestFullscreen();

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadData();
    } else {
      bukaModalAlert("Login Gagal", "Username atau Password salah. Periksa kembali!");
      btn.disabled = false;
      spinner.style.display = "none";
      text.innerText = "MASUK";
    }
  })
  .catch(() => {
    bukaModalAlert("Koneksi Error", "Gagal terhubung ke server. Periksa internet Anda.");
    btn.disabled = false;
    spinner.style.display = "none";
    text.innerText = "MASUK";
  });
}

function ambilCustomer(text) {
  const m = text.match(/CUSTOMER\s*:\s*([^\n]+)/i);
  return m ? m[1].trim() : "";
}

function ambilWa(text) {
  const wa = text.match(/08\d{8,13}/g);
  return wa || [];
}

/* 1. KETIKA TOMBOL KIRIM DIKLIK -> BUKA KAMERA DULU */
function mintaFotoBukti(customer, wa, idx) {
  dataAktifPengiriman = { customer, wa, idx };
  
  document.getElementById("mTitle").innerText = "Ambil Foto Bukti";
  document.getElementById("mText").innerText = "Customer: " + customer;
  document.getElementById("containerKamera").style.display = "block";
  
  document.getElementById("mButtons").innerHTML = `
    <button type="button" class="btn-batal btn-modal" onclick="tutupModal()">BATAL</button>
    <button type="button" class="btn-oke btn-modal" onclick="ambilFotoDanKirim()">AMBIL FOTO & KIRIM</button>
  `;

  document.getElementById("customModal").classList.add("aktif");

  // Jalankan Kamera Belakang HP (environment)
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
  .then(stream => {
    streamKamera = stream;
    document.getElementById("kamera-preview").srcObject = stream;
  })
  .catch(err => {
    bukaModalAlert("Kamera Error", "Gagal membuka kamera. Pastikan izin kamera aktif.");
  });
}

/* 2. PROSES CAPTURE GAMBAR DARI VIDEO & KIRIM KE SERVER */
function ambilFotoDanKirim() {
  const video = document.getElementById("kamera-preview");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext("2d");
  
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  fotoBase64Data = canvas.toDataURL("image/jpeg", 0.6); // Kompresi kualitas 60% agar ringan dikirim

  // Matikan kamera setelah foto diambil
  if (streamKamera) {
    streamKamera.getTracks().forEach(track => track.stop());
    streamKamera = null;
  }

  // Lanjutkan proses pengiriman ke server
  eksekusiKirimKeServer();
}

/* 3. EKSEKUSI PENGIRIMAN DATA + FOTO KE GOOGLE APPS SCRIPT */
function eksekusiKirimKeServer() {
  const { customer, wa, idx } = dataAktifPengiriman;
  const driver = localStorage.getItem("driver") || "DRIVER";
  
  document.getElementById("containerKamera").style.display = "none";
  document.getElementById("mTitle").innerText = "Mengirim Data...";
  document.getElementById("mText").innerText = "Mohon tunggu, sedang mengunggah bukti foto...";
  document.getElementById("mButtons").innerHTML = "";

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      action: "kirim_pengiriman",
      customer: customer,
      driver: driver,
      wa: wa,
      foto: fotoBase64Data
    })
  })
  .then(r => r.json())
  .then(res => {
    if(res.status === "OK"){
      bukaModalAlert("Berhasil!", "Status pengiriman & foto bukti untuk " + customer + " sukses disimpan.");
      loadData();
    } else {
      bukaModalAlert("Gagal", "Respon server: " + (res.pesan || "Terjadi kesalahan"));
    }
  })
  .catch(() => {
    bukaModalAlert("Error", "Gagal mengirim data. Coba beberapa saat lagi.");
  });
}

/* LOAD DATA */
function loadData() {
  fetch(API_URL)
  .then(r => r.json())
  .then(data => {
    const orders = data.orders || [];
    const terkirim = data.terkirim || {};

    let html = "";
    let total = 0, ok = 0, no = 0;

    orders.forEach((row, index) => {
      const isi = row[0] || "";
      if(!isi) return;

      total++;
      const customer = ambilCustomer(isi);
      const key = customer.toLowerCase();
      const wa = ambilWa(isi);
      const sudah = terkirim[key] === true;

      if(sudah) ok++; else no++;

      html += '<div class="card" data-customer="' + key + '">';
      html += '<div class="data">' + isi + '</div>';
      html += '<div class="wa-group">';
      
      if(wa[0]) {
        html += '<a class="wa-box" href="https://wa.me/62' + wa[0].substring(1) + '" target="_blank"><div class="wa-icon"><svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.528 1.981 14.062.96 11.43.96c-5.44 0-9.866 4.372-9.87 9.802 0 1.689.445 3.339 1.287 4.792l-.999 3.649 3.739-.968zm11.341-7.713c-.26-.13-1.534-.757-1.772-.842-.238-.085-.411-.13-.583.13-.172.26-.666.842-.817 1.013-.151.17-.301.19-.561.06-.26-.13-1.1-.405-2.096-1.294-.775-.69-1.299-1.543-1.451-1.802-.152-.258-.016-.399.114-.529.117-.117.26-.302.39-.453.13-.151.173-.258.26-.43.086-.172.043-.322-.022-.453-.064-.13-.583-1.403-.799-1.924-.211-.507-.426-.438-.583-.446-.151-.008-.323-.009-.495-.009-.172 0-.452.065-.689.322-.237.258-.904.883-.904 2.153 0 1.27.925 2.5 1.054 2.671.129.172 1.82 2.779 4.41 3.897.616.265 1.096.424 1.471.543.619.197 1.183.169 1.629.103.497-.074 1.534-.627 1.749-1.233.215-.607.215-1.127.151-1.233-.064-.108-.236-.172-.496-.302z"/></svg></div><div class="wa-text">WA 1</div></a>';
      }
      if(wa[1]) {
        html += '<a class="wa-box wa2" href="https://wa.me/62' + wa[1].substring(1) + '" target="_blank"><div class="wa-icon"><svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.528 1.981 14.062.96 11.43.96c-5.44 0-9.866 4.372-9.87 9.802 0 1.689.445 3.339 1.287 4.792l-.999 3.649 3.739-.968zm11.341-7.713c-.26-.13-1.534-.757-1.772-.842-.238-.085-.411-.13-.583.13-.172.26-.666.842-.817 1.013-.151.17-.301.19-.561.06-.26-.13-1.1-.405-2.096-1.294-.775-.69-1.299-1.543-1.451-1.802-.152-.258-.016-.399.114-.529.117-.117.26-.302.39-.453.13-.151.173-.258.26-.43.086-.172.043-.322-.022-.453-.064-.13-.583-1.403-.799-1.924-.211-.507-.426-.438-.583-.446-.151-.008-.323-.009-.495-.009-.172 0-.452.065-.689.322-.237.258-.904.883-.904 2.153 0 1.27.925 2.5 1.054 2.671.129.172 1.82 2.779 4.41 3.897.616.265 1.096.424 1.471.543.619.197 1.183.169 1.629.103.497-.074 1.534-.627 1.749-1.233.215-.607.215-1.127.151-1.233-.064-.108-.236-.172-.496-.302z"/></svg></div><div class="wa-text">WA 2</div></a>';
      }

      html += '</div>';
      html += '<div class="aksi">';
      // Tombol Kirim sekarang memicu fungsi buka kamera terlebih dahulu (mintaFotoBukti)
      html += '<button type="button" class="btn ' + (sudah ? 'sudah' : 'kirim') + '" ' + (sudah ? 'disabled' : '') + ' onclick="mintaFotoBukti(\'' + customer + '\',\'' + (wa[0] || '') + '\', ' + index + ')">';
      html += '<div class="btn-isi"><span>' + (sudah ? '✓ TERKIRIM' : '🚚 KIRIM & FOTO') + '</span></div>';
      html += '</button>';
      html += '</div>';
      html += '</div>';
    });

    document.getElementById("stats").innerHTML = '<div class="stats"><div class="boxstat"><div class="t">TOTAL</div><div class="v" style="font-weight:700;font-size:16px;">' + total + '</div></div><div class="boxstat"><div class="t">TERKIRIM</div><div class="v" style="font-weight:700;font-size:16px;color:#16a34a;">' + ok + '</div></div><div class="boxstat"><div class="t">BELUM</div><div class="v" style="font-weight:700;font-size:16px;color:#1565c0;">' + no + '</div></div></div>';

    document.getElementById("list").innerHTML = html;
    filterCustomer();
  });
}

function filterCustomer() {
  const keyword = document.getElementById("cariCustomer").value.toLowerCase();
  const cards = document.querySelectorAll(".card");
  
  cards.forEach(card => {
    const namaCustomer = card.getAttribute("data-customer");
    if (namaCustomer.includes(keyword)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>
</body>
</html>
