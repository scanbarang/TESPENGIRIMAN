<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOGIN PENGIRIMAN</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f1f5f9;
}

.login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
width:280px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
background:#1565c0;
color:#fff;
border:none;
border-radius:10px;
font-weight:bold;
}

#app{
display:none;
padding:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <div class="box">
    <h3>LOGIN DRIVER</h3>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">MASUK</button>
  </div>
</div>

<!-- APP -->
<div id="app">

<h3>CEK PENGIRIMAN</h3>
<div id="konten">Loading...</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzjNnwv0gSi1a7OQVhkzJ-xDgJ-WRPhlNvu9WSyR-DhXOTz_DPGCOHu53eN9cOjqLna/exec";

function login(){

const user=document.getElementById("user").value;
const pass=document.getElementById("pass").value;

fetch(API_URL+"?action=login&user="+user+"&pass="+pass)
.then(r=>r.json())
.then(res=>{

if(res.status==="OK"){

localStorage.setItem("driver",res.user);

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";

loadData();

}else{
alert("Login gagal!");
}

})
.catch(()=>{
alert("Server error / URL salah");
});

}

function loadData(){
document.getElementById("konten").innerHTML="LOGIN BERHASIL ✔ SISTEM SIAP";
}

</script>

</body>
</html>
