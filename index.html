<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengiriman</title>

<style>
body{
  margin:0;
  padding:8px;
  font-family:Arial;
  background:#f5f7fa;
}

.header{
  background:#1565c0;
  color:white;
  padding:10px;
  text-align:center;
  border-radius:10px;
}

.card{
  background:white;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  font-size:13px;
  white-space:pre-wrap;
}

.aksi{
  display:flex;
  gap:4px;
  margin-top:6px;
}

a,button{
  flex:1;
  padding:6px;
  font-size:11px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  text-align:center;
}

.wa1{
  background:#25D366;
  color:white;
  text-decoration:none;
}

.kirim{
  background:#1565c0;
  color:white;
}

.sudah{
  background:#16a34a;
  color:white;
}
</style>
</head>

<body>

<div class="header">
  CEK PENGIRIMAN
</div>

<div id="list">Loading...</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxuDE6FlKICIcXm24k8UPP8GW7MPlPAOrqkGyyZCO11CKGj_tYbhKx7CSyrXqXFGpAA/exec";

/* LOAD DATA */
function loadData(){

fetch(API_URL + "?t=" + new Date().getTime())
.then(r => r.json())
.then(data => {

let html = "";

data.forEach(row => {

const customer = row[0];
if(!customer) return;

const detail = row[0];

html += `
<div class="card">

${detail}

<div class="aksi">

<button class="kirim"
onclick="kirim('${customer}')">
TERKIRIM
</button>

</div>

</div>
`;

});

document.getElementById("list").innerHTML = html;

});

}

/* KIRIM STATUS */
function kirim(customer){

const driver = "DRIVER";

fetch(API_URL + "?customer=" + encodeURIComponent(customer) + "&driver=" + encodeURIComponent(driver), {
method:"POST"
})
.then(r => r.text())
.then(res => {

if(res === "OK"){
  alert(customer + " TERKIRIM");
  loadData();
}else{
  alert("Gagal");
}

});

}

loadData();

</script>

</body>
</html>
