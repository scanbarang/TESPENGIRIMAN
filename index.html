<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengiriman</title>

<style>

body{
  margin:0;
  padding:10px;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
}

/* HEADER */
.header{
  background:#1565c0;
  color:white;
  padding:12px;
  border-radius:12px;
  text-align:center;
  margin-bottom:10px;
}

.header img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid white;
}

.header h2{
  margin:5px 0 0 0;
  font-size:16px;
}

/* INFO */
.jumlah{
  text-align:center;
  margin-bottom:10px;
}

.tanggal-besar{
  font-size:16px;
  font-weight:bold;
  color:#1565c0;
}

.total{
  font-size:13px;
  font-weight:bold;
}

/* CARD */
.card{
  background:white;
  padding:10px;
  margin-bottom:8px;
  border-radius:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
  white-space:pre-wrap;
  font-size:13px;
  line-height:1.4;
}

/* ACTION */
.aksi{
  margin-top:8px;
  display:flex;
  gap:5px;
  align-items:center;
}

/* WA BUTTON */
a{
  text-decoration:none;
  padding:4px 8px;
  border-radius:6px;
  color:white;
  font-size:12px;
  display:inline-block;
}

.wa1{background:#25D366;}
.wa2{background:#128C7E;}

/* BUTTON TERKIRIM */
.btn{
  padding:4px 8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}

.kirim{
  background:#1565c0;
  color:white;
}

.sudah{
  background:#16a34a;
  color:white;
}

</style>
</head>

<body>

<div class="header">
  <img src="logo.png">
  <h2>CEK PENGIRIMAN</h2>
</div>

<div id="jumlah">Memuat data...</div>
<div id="list"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwmXMx6F6-XjjsikpofXZfWJWNsnEEliyQCoFkVCMZzfn9rfAQRaJmdu8niM63p9zEE/exec";

function loadData(){

fetch(API_URL + "?t=" + new Date().getTime())
.then(r => r.text())
.then(text => {

  let data = JSON.parse(text);

  let html = "";
  let total = 0;
  let tanggal = "";

  data.forEach(row => {

    const isi = row[0];
    const tgl = row[1];
    const status = row[2] || "";

    if(!isi) return;

    total++;

    if(!tanggal && tgl){
      tanggal = new Date(tgl).toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"long",
        year:"numeric"
      });
    }

    const sudah = status === "TERKIRIM";

    let found = isi.match(/08\d{8,13}/g) || [];
    let wa1 = found[0] || "";
    let wa2 = found[1] || "";

    let waButtons = "";

    if(wa1){
      waButtons += `<a class="wa1" href="https://wa.me/62${wa1.substring(1)}" target="_blank">WA 1</a>`;
    }

    if(wa2){
      waButtons += `<a class="wa2" href="https://wa.me/62${wa2.substring(1)}" target="_blank">WA 2</a>`;
    }

    html += `
      <div class="card">

        ${isi}

        <div class="aksi">

          ${waButtons}

          <button class="btn ${sudah?'sudah':'kirim'}"
            onclick="kirimStatus('${isi.replace(/'/g,'')}')"
            ${sudah?'disabled':''}>

            ${sudah?'TERKIRIM ✓':'KIRIM'}

          </button>

        </div>

      </div>
    `;

  });

  document.getElementById("jumlah").innerHTML = `
    <div class="tanggal-besar">📅 ${tanggal}</div>
    <div class="total">Total: ${total}</div>
  `;

  document.getElementById("list").innerHTML = html;

});

}

function kirimStatus(customer){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
customer:customer,
status:"TERKIRIM"
})
})
.then(()=>loadData());

}

loadData();

</script>

</body>
</html>
