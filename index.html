<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEK PENGIRIMAN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body{
margin:0;
font-family:'Inter', Arial, sans-serif;
background:#f4f6f9;
color:#111;
}

/* LOGIN */
.login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
width:280px;
text-align:center;
}

.box img{
width:80px;
height:80px;
border-radius:50%;
border:2px solid #ddd;
object-fit:cover;
margin-bottom:8px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#1565c0;
color:#fff;
font-weight:700;
cursor:pointer;
}

/* APP */
#app{
display:none;
padding:10px;
}

/* HEADER */
.header{
background:#ffffff;
padding:14px;
border-radius:14px;
text-align:center;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,.06);
border:1px solid #eee;
}

/* 🔥 CEK PENGIRIMAN COLOR (UNGU) */
.header-title{
font-size:16px;
font-weight:800;
color:#6d28d9;
letter-spacing:1px;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-bottom:10px;
}

.boxstat{
background:#fff;
padding:10px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.05);
border:1px solid #eee;
}

.boxstat .v{font-weight:700;font-size:15px;}
.boxstat .t{font-size:11px;color:#666;}

.c1{color:#333;}
.c2{color:#16a34a;}
.c3{color:#f59e0b;}

/* CARD */
.card{
background:#fff;
padding:12px;
margin-bottom:10px;
border-radius:14px;
border:1px solid #e5e7eb;
box-shadow:0 2px 6px rgba(0,0,0,.05);
font-size:13px;
line-height:1.5;
position:relative;
}

/* LEFT LINE */
.card::before{
content:"";
position:absolute;
left:0;
top:0;
width:4px;
height:100%;
background:#d1d5db;
}

/* ORDER VERTICAL */
.data{
white-space:pre-line;
font-weight:600;
}

/* WA */
.wa-group{
display:flex;
gap:10px;
margin-top:10px;
}

.wa-box{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
width:60px;
}

.wa-icon{
width:38px;
height:38px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
}

.wa2 .wa-icon{
background:#128C7E;
}

.wa-text{
font-size:11px;
margin-top:4px;
color:#555;
font-weight:600;
}

/* BUTTON */
.aksi{
margin-top:8px;
}

.btn{
width:100%;
height:40px;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

/* KIRIM tetap hijau */
.kirim{
background:#16a34a;
color:#fff;
}

.sudah{
background:#444;
color:#fff;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">

  <div class="box">

    <img src="logo.png">

    <h3 style="margin:0;">UFO KEBONSARI MALANG</h3>
    <p style="font-size:12px;color:#777;">Sistem Pengiriman Driver</p>

    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">

    <button onclick="login()">MASUK</button>

  </div>

</div>

<!-- APP -->
<div id="app">

<div class="header">
  <div class="header-title">CEK PENGIRIMAN</div>
</div>

<div id="stats"></div>
<div id="list"></div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzjNnwv0gSi1a7OQVhkzJ-xDgJ-WRPhlNvu9WSyR-DhXOTz_DPGCOHu53eN9cOjqLna/exec";

/* LOGIN */
function login(){

const user=document.getElementById("user").value;
const pass=document.getElementById("pass").value;

fetch(API_URL+"?action=login&user="+user+"&pass="+pass)
.then(r=>r.json())
.then(res=>{

if(res.status==="OK"){

localStorage.setItem("driver",res.user);

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";

loadData();

}else{
alert("Login gagal!");
}

});

}

/* PARSE */
function ambilCustomer(text){
const m=text.match(/CUSTOMER\s*:\s*([^\n]+)/i);
return m ? m[1].trim() : "";
}

function ambilWa(text){
const wa=text.match(/08\d{8,13}/g);
return wa || [];
}

/* KIRIM */
function kirimStatus(customer,wa){

const driver=localStorage.getItem("driver") || "-";

fetch(API_URL+
"?customer="+encodeURIComponent(customer)+
"&driver="+encodeURIComponent(driver)+
"&wa="+wa
)
.then(()=>loadData());
}

/* LOAD DATA */
function loadData(){

fetch(API_URL)
.then(r=>r.json())
.then(data=>{

const orders=data.orders || [];
const terkirim=data.terkirim || {};

let html="";
let total=0,ok=0,no=0;

orders.forEach(row=>{

const isi=row[0] || "";
if(!isi) return;

total++;

const customer=ambilCustomer(isi);
const key=customer.toLowerCase();
const wa=ambilWa(isi);
const sudah=terkirim[key]===true;

if(sudah) ok++; else no++;

html+=`
<div class="card">

<div class="data">${isi}</div>

<div class="wa-group">

${wa[0] ? `
<a class="wa-box" href="https://wa.me/62${wa[0].substring(1)}" target="_blank">
<div class="wa-icon"></div>
<div class="wa-text">WA 1</div>
</a>` : ""}

${wa[1] ? `
<a class="wa-box wa2" href="https://wa.me/62${wa[1].substring(1)}" target="_blank">
<div class="wa-icon"></div>
<div class="wa-text">WA 2</div>
</a>` : ""}

</div>

<div class="aksi">
<button class="btn ${sudah?'sudah':'kirim'}"
onclick="kirimStatus(\`${customer}\`,\`${wa[0]||''}\`)">
${sudah?'✓ TERKIRIM':'🚚 KIRIM'}
</button>
</div>

</div>
`;
});

document.getElementById("stats").innerHTML=`
<div class="stats">
<div class="boxstat"><div class="t">TOTAL</div><div class="v">${total}</div></div>
<div class="boxstat"><div class="t">TERKIRIM</div><div class="v">${ok}</div></div>
<div class="boxstat"><div class="t">BELUM</div><div class="v">${no}</div></div>
</div>
`;

document.getElementById("list").innerHTML=html;

});

}

</script>

</body>
</html>
