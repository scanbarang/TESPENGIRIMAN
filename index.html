<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengiriman</title>

<style>
body{
  margin:0;
  padding:10px;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
}

/* HEADER */
.header{
  background:#1565c0;
  color:white;
  padding:8px 10px;
  border-radius:12px;
  text-align:center;
  margin-bottom:8px;
}

.header img{
  width:90px;
  height:90px;
  border-radius:50%;
  border:3px solid #22c55e;
  object-fit:cover;
}

.header h2{
  margin:4px 0 0 0;
  font-size:18px;
}

/* INFO */
.jumlah{
  text-align:center;
  margin-bottom:8px;
}

.tanggal-besar{
  font-size:18px;
  font-weight:bold;
  color:#1565c0;
  margin-bottom:2px;
}

.total{
  font-size:14px;
  font-weight:bold;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  padding:10px;
  margin-bottom:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  white-space:pre-wrap;
  line-height:1.35;
  font-size:14px;
}

.card p{margin:0;}

/* AKSI */
.aksi{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.wa-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#25D366;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
  margin:0;
}

.kirim-btn{
  background:#1565c0;
  color:white;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
  margin:0;
}

/* LOGIN */
#loginBox{
  position:fixed;
  inset:0;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#loginBox > div{
  background:white;
  padding:20px;
  border-radius:12px;
  width:85%;
  max-width:300px;
  text-align:center;
}

#loginBox input, #loginBox select{
  width:100%;
  padding:8px;
  margin-bottom:10px;
}

#loginBox button{
  width:100%;
  padding:8px;
  background:#1565c0;
  color:white;
  border:none;
  border-radius:8px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div>
    <h3>LOGIN PENGIRIMAN</h3>

    <select id="user">
      <option value="">-- Pilih Nama --</option>
      <option value="Poniadi">Poniadi</option>
      <option value="Eko">Eko</option>
    </select>

    <input id="pin" type="password" placeholder="PIN">

    <button onclick="login()">LOGIN</button>

    <p id="loginError" style="color:red;font-size:12px;"></p>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <img src="logo.png">
  <h2>CEK PENGIRIMAN</h2>
</div>

<!-- PILIH (tidak terlalu penting lagi tapi tetap ada) -->
<div style="background:white;padding:10px;border-radius:12px;margin-bottom:8px;">
<h3 style="margin:0 0 6px 0;">Pengiriman Aktif</h3>
<div id="driverShow"></div>
</div>

<div id="jumlah" class="jumlah">Memuat data...</div>
<div id="list"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwmXMx6F6-XjjsikpofXZfWJWNsnEEliyQCoFkVCMZzfn9rfAQRaJmdu8niM63p9zEE/exec";

/* LOGIN DATA */
const users = {
  "Poniadi":"1111",
  "Eko":"2222",
  "Sendi":"3333",
  
};

function login(){
  const user = document.getElementById("user").value;
  const pin = document.getElementById("pin").value;

  if(users[user] === pin){
    localStorage.setItem("driver", user);
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("driverShow").innerHTML = "Driver: <b>"+user+"</b>";
    loadData();
  } else {
    document.getElementById("loginError").innerText = "PIN salah!";
  }
}

/* LOAD DATA */
function loadData(){

fetch(API_URL)
.then(r=>r.json())
.then(data=>{

let html = "";
let total = 0;
let tanggalPengiriman = "";

data.forEach(row=>{

const isi = (row[0]||"")
.replace(/\n\s*\n+/g,"\n")
.trim();

if(!isi) return;

total++;

if(!tanggalPengiriman && row[1]){
const tgl = new Date(row[1]);
tanggalPengiriman = tgl.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
}

const wa1Match = isi.match(/WA 1 : ([0-9]+)/);
const wa2Match = isi.match(/WA 2 : ([0-9]+)/);
const customerMatch = isi.match(/CUSTOMER : (.*)/);

const wa1 = wa1Match ? wa1Match[1] : "";
const wa2 = wa2Match ? wa2Match[1] : "";
const customer = customerMatch ? customerMatch[1].trim() : "";

html += `
<div class="card">

${isi}

<div class="aksi">
<a href="https://wa.me/62${wa1.substring(1)}" target="_blank" class="wa-btn">💬 WA 1</a>
<a href="https://wa.me/62${wa2.substring(1)}" target="_blank" class="wa-btn">💬 WA 2</a>

<button class="kirim-btn" onclick="kirimStatus(this,'${customer}','${wa1}')">
✅ TERKIRIM
</button>
</div>

</div>
`;
});

document.getElementById("jumlah").innerHTML = `
<div class="tanggal-besar">🗓️ ${tanggalPengiriman}</div>
<div class="total">Total Pengiriman : ${total}</div>
`;

document.getElementById("list").innerHTML = html;

});

}

/* KIRIM STATUS */
function kirimStatus(btn,customer,wa){

const driver = localStorage.getItem("driver");

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
customer:customer,
status:"TERKIRIM",
pengiriman:driver,
wa:wa
})
})
.then(r=>r.text())
.then(res=>{

btn.innerHTML="🟢 SUDAH TERKIRIM";
btn.disabled=true;
btn.style.background="#16a34a";

alert(customer+" berhasil dikirim");

});

}

/* AUTO LOGIN CHECK */
window.onload = function(){
const driver = localStorage.getItem("driver");

if(driver){
document.getElementById("loginBox").style.display="none";
document.getElementById("driverShow").innerHTML="Driver: <b>"+driver+"</b>";
loadData();
}
};

</script>

</body>
</html>
