<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengiriman</title>

<style>
body{
  margin:0;
  padding:10px;
  font-family:Arial;
  background:#f5f7fa;
}

.header{
  background:#1565c0;
  color:white;
  padding:12px;
  text-align:center;
  border-radius:10px;
  margin-bottom:10px;
}

.card{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.aksi{
  margin-top:8px;
  display:flex;
  gap:5px;
}

.wa-btn{
  background:#25D366;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  text-decoration:none;
}

.kirim-btn{
  background:#1565c0;
  color:white;
  padding:6px 10px;
  border:none;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="header">
  <h2>CEK PENGIRIMAN</h2>
</div>

<div id="list">Memuat data...</div>

<script>

const API_URL = "https://script.google.com/macros/s/XXXXX/exec";

function loadData(){

fetch(API_URL + "?t=" + new Date().getTime())
.then(r => r.json())
.then(data => {

let html = "";

data.forEach(row => {

try {

const customer = row[1];
const status = row[2] || "";
const driver = row[3] || "";
const wa = row[6] || "";

if(!customer) return;

/* SAFE WA */
let waLink = "#";
if(wa && wa.length > 3){
waLink = "https://wa.me/62" + wa.substring(1);
}

const sudah = status === "TERKIRIM";

html += `
<div class="card">

<p>${customer}</p>
<p>${driver ? "Driver: "+driver : ""}</p>

<div class="aksi">

<a class="wa-btn" href="${waLink}" target="_blank">WA</a>

<button class="kirim-btn" ${sudah ? "disabled" : ""}
onclick="kirimStatus('${customer}')">
${sudah ? "SUDAH TERKIRIM" : "TERKIRIM"}
</button>

</div>

</div>
`;

} catch(e){
console.log("error row", e);
}

});

document.getElementById("list").innerHTML = html;

})
.catch(err => {
console.log("FETCH ERROR:", err);
document.getElementById("list").innerHTML = "Gagal load data";
});

}

function kirimStatus(customer){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
customer:customer,
driver:""
})
})
.then(()=>loadData());

}

loadData();

</script>

</body>
</html>
