<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEK PENGIRIMAN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body{
margin:0;
padding:10px;
font-family:'Inter', Arial, sans-serif;
background:#f1f5f9;
color:#1f2937;
}

/* HEADER */
.header{
background:#1565c0;
color:#fff;
padding:15px;
text-align:center;
border-radius:18px;
margin-bottom:10px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header img{
width:75px;
height:75px;
border-radius:50%;
border:3px solid #fff;
object-fit:cover;
}

/* TOTAL */
#jumlah{
text-align:center;
margin-bottom:10px;
}

.total{
font-size:16px;
font-weight:700;
color:#1565c0;
background:#fff;
padding:10px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.06);
}

/* CARD */
.card{
background:#fff;
padding:12px;
margin-bottom:10px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
border-left:4px solid #1565c0;
font-size:12.5px;
}

/* DATA TEXT */
.data{
display:flex;
flex-direction:column;
gap:3px;
line-height:1.4;
}

/* WA BUTTON */
.wa-group{
display:flex;
gap:6px;
margin-top:10px;
}

.wa-btn{
flex:1;
height:36px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
gap:5px;
font-size:12px;
font-weight:700;
color:#fff;
text-decoration:none;
}

.wa1{background:#25D366;}
.wa2{background:#128C7E;}

/* ACTION */
.aksi{
margin-top:8px;
}

.btn{
width:100%;
height:40px;
border:none;
border-radius:10px;
font-size:13px;
font-weight:700;
cursor:pointer;
}

.kirim{
background:#1565c0;
color:#fff;
}

.sudah{
background:#16a34a;
color:#fff;
}
</style>

</head>

<body>

<div class="header">
<img src="logo.png">
<div style="margin-top:8px;font-size:18px;font-weight:700;">
CEK PENGIRIMAN
</div>
</div>

<div id="jumlah">Memuat data...</div>
<div id="list"></div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbyt7ESUBCLIcNfzCuOZAThCyIesFFlO0nHn4jgzDYoTit6byLEksINbdUc3J0XDa-gZ/exec";

function ambilCustomer(text){
const m=text.match(/CUSTOMER\s*:\s*([^\n]+)/i);
return m ? m[1].trim() : "";
}

function ambilWa(text){
const wa=text.match(/08\d{8,13}/g);
return wa || [];
}

function kirimStatus(customer,wa){

if(!customer){
alert("Customer tidak ditemukan");
return;
}

const driver=localStorage.getItem("driver") || "DRIVER";

fetch(API_URL+
"?customer="+encodeURIComponent(customer)+
"&driver="+encodeURIComponent(driver)+
"&wa="+encodeURIComponent(wa)
)
.then(r=>r.text())
.then(res=>{

if(res==="OK"){
alert("✅ "+customer+" terkirim");
loadData();
}else{
alert(res);
}

})
.catch(()=>{
alert("Server Error");
});

}

function loadData(){

fetch(API_URL+"?t="+Date.now())
.then(r=>r.json())
.then(data=>{

const orders=data.orders || [];
const terkirim=data.terkirim || {};

let html="";
let total=0;

orders.forEach(row=>{

const isi=row[0] || "";
if(!isi) return;

total++;

const customer=ambilCustomer(isi);
const key=customer.toLowerCase();
const wa=ambilWa(isi);
const sudah=terkirim[key]===true;

html+=`
<div class="card">

  <div class="data">
    <div>${isi}</div>
  </div>

  <div class="wa-group">

    ${wa[0] ? `
    <a class="wa-btn wa1"
       href="https://wa.me/62${wa[0].substring(1)}"
       target="_blank">
       📱 WA 1
    </a>` : ""}

    ${wa[1] ? `
    <a class="wa-btn wa2"
       href="https://wa.me/62${wa[1].substring(1)}"
       target="_blank">
       📱 WA 2
    </a>` : ""}

  </div>

  <div class="aksi">
    <button
      class="btn ${sudah ? 'sudah' : 'kirim'}"
      ${sudah ? 'disabled' : ''}
      onclick="kirimStatus(\`${customer}\`,\`${wa[0] || ""}\`)">

      ${sudah ? '✅ TERKIRIM' : '🚚 KIRIM'}

    </button>
  </div>

</div>
`;
});

document.getElementById("jumlah").innerHTML=`
<div class="total">📊 Total Pengiriman Hari Ini: ${total}</div>
`;

document.getElementById("list").innerHTML=html;

})
.catch(()=>{

document.getElementById("jumlah").innerHTML="❌ Gagal mengambil data";

});

}

loadData();
setInterval(loadData,5000);

</script>

</body>
</html>
